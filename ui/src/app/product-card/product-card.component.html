<div class="card-container" (click)="onCardClick()">
  <div class="image-container">
    <img [src]="product.imageUrl" [alt]="product.productName" class="product-img" />

    <!-- Rating overlay -->
    <div class="rating-badge">
       {{ product.rating || '4.3' }} <span class="star">★</span> | {{ product.reviewCount || '289' }}
    </div>

    <!-- Wishlist action (top right) -->
    <div class="wishlist-btn" (click)="$event.stopPropagation()">
      ♡
    </div>

    <!-- Add to cart overlay action (on hover) -->
    <div class="add-to-cart-overlay">
       <button class="add-to-cart-btn" (click)="onAddToCart($event)">ADD TO BAG</button>
    </div>
  </div>

  <div class="product-meta">
    <h3 class="brand-name">Bewakoof</h3>
    <h4 class="product-title">{{ product.productName }}</h4>

    <div class="price-row">
      <span class="current-price">Rs. {{ product.price }}</span>
      <span class="original-price" *ngIf="product.price < 1500">Rs. {{ product.price + 60 }}</span>
      <span class="discount-percent" *ngIf="product.price < 1500">({{ calculateDiscount() }}% OFF)</span>
    </div>
  </div>
</div>
